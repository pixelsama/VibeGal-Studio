name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and project versions
        run: pnpm check:versions

      - name: Run release quality gates
        run: |
          pnpm test
          pnpm build
          pnpm check:schemas
          pnpm check:engine-types
          pnpm check:renderer-template
          pnpm check:example-template
          pnpm check:doc-contract
          pnpm check:vocabulary
          pnpm smoke:release
          cargo test --locked --manifest-path packages/studio/src-tauri/Cargo.toml

  bundle:
    name: Bundle and install smoke (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: VibeGal-Studio-Windows-x64
            bundle_command: pnpm bundle:windows
            bundle_path: packages/studio/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS arm64
            os: macos-latest
            artifact: VibeGal-Studio-macOS-arm64
            bundle_command: pnpm tauri build --bundles app --ci --no-sign
            bundle_path: packages/studio/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect protected signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          node -e "const fs=require('node:fs'); const os=process.env.RUNNER_OS; const env=process.env; let status='unsigned-dry-run'; if(os==='macOS' && ['APPLE_CERTIFICATE_BASE64','APPLE_CERTIFICATE_PASSWORD','APPLE_SIGNING_IDENTITY','APPLE_NOTARY_KEY_BASE64','APPLE_NOTARY_KEY_ID','APPLE_NOTARY_ISSUER_ID'].every(k=>env[k])) status='signed-notarized'; else if(os==='Windows' && ['WINDOWS_CERTIFICATE_BASE64','WINDOWS_CERTIFICATE_PASSWORD'].every(k=>env[k])) status='signed'; fs.appendFileSync(env.GITHUB_OUTPUT, 'status='+status+'\\n'); console.log('Release signing status: '+status);"

      - name: Build platform bundle
        run: ${{ matrix.bundle_command }}

      - name: Package unsigned macOS DMG
        if: runner.os == 'macOS' && steps.signing.outputs.status == 'unsigned-dry-run'
        run: pnpm tauri bundle --bundles dmg --ci --no-sign

      - name: Sign app, package DMG, and notarize macOS bundle
        if: runner.os == 'macOS' && steps.signing.outputs.status == 'signed-notarized'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/vibegal-release.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/vibegal-release.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          APP="packages/studio/src-tauri/target/release/bundle/macos/VibeGal-Studio.app"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          pnpm tauri bundle --bundles dmg --ci --no-sign
          DMG=$(find packages/studio/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$DMG"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$DMG"
          xcrun notarytool submit "$DMG" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          VERIFY_MOUNT="$RUNNER_TEMP/vibegal-signed-dmg"
          mkdir -p "$VERIFY_MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$VERIFY_MOUNT"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_MOUNT/VibeGal-Studio.app"
          spctl --assess --type execute -v "$VERIFY_MOUNT/VibeGal-Studio.app"
          hdiutil detach "$VERIFY_MOUNT"
          rm -f "$CERTIFICATE" "$NOTARY_KEY"
          security delete-keychain "$KEYCHAIN"

      - name: Sign Windows installer
        if: runner.os == 'Windows' && steps.signing.outputs.status == 'signed'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "vibegal-release.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $installer = Get-ChildItem packages/studio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $signTool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signTool sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signTool verify /pa /all $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $certificate -Force

      - name: Record signing status
        run: node -e "require('node:fs').writeFileSync('release-signing-status-${{ runner.os }}.txt', '${{ steps.signing.outputs.status }}\\n')"

      - name: Verify Apple Silicon bundle architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64"
          file packages/studio/src-tauri/target/release/bundle/macos/VibeGal-Studio.app/Contents/MacOS/vibegal-studio | grep -q 'arm64'

      - name: Install and smoke Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/studio/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $project = Join-Path $env:RUNNER_TEMP "Project With Spaces"
          Copy-Item examples/sample-novel $project -Recurse
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { exit $installProcess.ExitCode }
          $installDir = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\VibeGal-Studio').InstallLocation.Trim('"')
          $cli = Join-Path $installDir "vibegal-cli.exe"
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32"
          & $cli validate $project --format json
          $validateExit = $LASTEXITCODE
          $env:PATH = $originalPath
          if ($validateExit -ne 0) { exit $validateExit }
          $webOut = Join-Path $env:RUNNER_TEMP "Web Export With Spaces"
          & $cli build $project --target web --out $webOut --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli smoke $webOut --target web --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktopOut = Join-Path $env:RUNNER_TEMP "Desktop Export With Spaces"
          & $cli build $project --target desktop --runtime tauri --out $desktopOut --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli smoke $desktopOut --target desktop --runtime tauri --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Get-ChildItem $installDir -Filter 'uninstall*.exe' | Select-Object -First 1
          if ($uninstaller) {
            $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) { exit $uninstallProcess.ExitCode }
          }

      - name: Mount and smoke macOS bundle
        if: runner.os == 'macOS'
        run: |
          DMG=$(find packages/studio/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          MOUNT="$RUNNER_TEMP/vibegal-dmg"
          INSTALL="$RUNNER_TEMP/VibeGal Installed App"
          PROJECT="$RUNNER_TEMP/Project With Spaces"
          mkdir -p "$MOUNT" "$INSTALL"
          ditto examples/sample-novel "$PROJECT"
          printf 'Y\n' | hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          ditto "$MOUNT/VibeGal-Studio.app" "$INSTALL/VibeGal-Studio.app"
          hdiutil detach "$MOUNT"
          CLI="$INSTALL/VibeGal-Studio.app/Contents/Resources/bin/vibegal-cli"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$CLI" validate "$PROJECT" --format json
          WEB_OUT="$RUNNER_TEMP/Web Export With Spaces"
          "$CLI" build "$PROJECT" --target web --out "$WEB_OUT" --format json
          "$CLI" smoke "$WEB_OUT" --target web --format json
          DESKTOP_OUT="$RUNNER_TEMP/Desktop Export With Spaces"
          "$CLI" build "$PROJECT" --target desktop --runtime tauri --out "$DESKTOP_OUT" --format json
          "$CLI" smoke "$DESKTOP_OUT" --target desktop --runtime tauri --format json

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.bundle_path }}
            release-signing-status-${{ runner.os }}.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download bundles
        uses: actions/download-artifact@v5
        with:
          pattern: VibeGal-Studio-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release manifests
        id: platform_signing
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          MACOS_SIGNING_STATUS=$(cat release-assets/release-signing-status-macOS.txt 2>/dev/null || printf 'unsigned-dry-run')
          WINDOWS_SIGNING_STATUS=$(cat release-assets/release-signing-status-Windows.txt 2>/dev/null || printf 'unsigned-dry-run')
          export MACOS_SIGNING_STATUS WINDOWS_SIGNING_STATUS
          export RELEASE_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'macos=%s\nwindows=%s\n' "$MACOS_SIGNING_STATUS" "$WINDOWS_SIGNING_STATUS" >> "$GITHUB_OUTPUT"
          node scripts/generate-release-manifest.mjs release-assets

      - name: Detect protected updater signing credentials
        id: updater
        env:
          VIBEGAL_UPDATER_SIGNING_KEY: ${{ secrets.VIBEGAL_UPDATER_SIGNING_KEY }}
          VIBEGAL_UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.VIBEGAL_UPDATER_SIGNING_KEY_PASSWORD }}
        run: |
          node -e "const fs=require('node:fs'); const status=process.env.VIBEGAL_UPDATER_SIGNING_KEY?'signed':'unsigned-dry-run'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'status='+status+'\\n'); console.log('Updater signing status: '+status);"

      - name: Sign update manifest
        if: steps.updater.outputs.status == 'signed'
        env:
          VIBEGAL_UPDATER_SIGNING_KEY: ${{ secrets.VIBEGAL_UPDATER_SIGNING_KEY }}
          VIBEGAL_UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.VIBEGAL_UPDATER_SIGNING_KEY_PASSWORD }}
        run: |
          node scripts/sign-update-manifest.mjs release-assets/update-manifest.json
          node -e "const fs=require('node:fs'); const file='release-assets/release-manifest.json'; const manifest=JSON.parse(fs.readFileSync(file)); manifest.signing.updater='signed'; fs.writeFileSync(file, JSON.stringify(manifest, null, 2)+'\\n');"

      - name: Report unsigned updater dry-run
        if: steps.updater.outputs.status == 'unsigned-dry-run'
        run: echo "Updater manifest is an unsigned-dry-run; clients must not trust it."

      - name: Publish dry-run manifests
        if: github.event_name == 'workflow_dispatch' && (steps.platform_signing.outputs.macos == 'unsigned-dry-run' || steps.platform_signing.outputs.windows == 'unsigned-dry-run' || steps.updater.outputs.status == 'unsigned-dry-run')
        uses: actions/upload-artifact@v4
        with:
          name: VibeGal-Studio-release-dry-run
          path: |
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
            release-assets/update-manifest.json
          if-no-files-found: error

      - name: Require protected credentials for tag publication
        if: github.event_name == 'push'
        env:
          MACOS_SIGNING_STATUS: ${{ steps.platform_signing.outputs.macos }}
          WINDOWS_SIGNING_STATUS: ${{ steps.platform_signing.outputs.windows }}
          UPDATER_SIGNING_STATUS: ${{ steps.updater.outputs.status }}
        run: |
          node -e "const statuses=['MACOS_SIGNING_STATUS','WINDOWS_SIGNING_STATUS','UPDATER_SIGNING_STATUS']; const missing=statuses.filter(key=>process.env[key]==='unsigned-dry-run'); if(missing.length) throw new Error('Release publication blocked: '+missing.join(', ')+' require protected signing credentials');"

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VibeGal-Studio $RELEASE_TAG" \
            --generate-notes \
            $PRERELEASE
